name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Select bump type or custom"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom

      custom_version:
        description: "Custom version (e.g., 1.2.3-canary.1). Used only if bump_type is 'custom'"
        required: false
        type: string

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Bump version
        id: version_step
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
        run: |
          if [ "$BUMP_TYPE" = "custom" ]; then
            pnpm version "$CUSTOM_VERSION" --no-git-tag-version
          else
            pnpm version "$BUMP_TYPE" --no-git-tag-version
          fi

      - name: Commit and tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "chore: version bump to v$VERSION"
          git tag v$VERSION
          git push origin HEAD v$VERSION
          echo "### ✅ Completed version bump: \`v$VERSION\`" >> $GITHUB_STEP_SUMMARY
